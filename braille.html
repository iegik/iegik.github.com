<script>
async function imageToBrailleAscii(dataURI) {
  const img = await loadImage(dataURI);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  const { data } = ctx.getImageData(0, 0, img.width, img.height);
  const gray = [];
  for (let i = 0; i < data.length; i += 4)
    gray.push((data[i] + data[i + 1] + data[i + 2]) / 3);

  const blockSize = 9;
  const cols = Math.floor(img.width / blockSize);
  const rows = Math.floor(img.height / blockSize);

  // Store braille rows separately
  const upperRows = [];
  const lowerRows = [];

  for (let y = 0; y < rows; y++) {
    let upperLine = "";
    let lowerLine = "";
    for (let x = 0; x < cols; x++) {
      const block = getBlock(gray, img.width, x * blockSize, y * blockSize, blockSize);
      const [upper, lower] = blockToBraille(block);
      upperLine += upper;
      lowerLine += lower;
    }
    upperRows.push(upperLine);
    lowerRows.push(lowerLine);
  }

  // Glue even/odd rows (upper + lower)
  let output = "";
  for (let i = 0; i < upperRows.length; i += 2) {
    const top = upperRows[i] || "";
    const bottom = lowerRows[i] || "";
    output += top + bottom + "\n";
  }
  return output;
}

function loadImage(uri) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = uri;
  });
}

function getBlock(gray, width, startX, startY, size) {
  const block = [];
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      block.push(gray[(startY + y) * width + (startX + x)]);
  return block;
}

// Return [upperRow, lowerRow] Braille characters
function blockToBraille(block) {
  const avg = block.reduce((a, b) => a + b, 0) / block.length;
  const dots = block.map(v => v < avg ? 1 : 0);

  let upper = "", lower = "";
  for (let by = 0; by < 2; by++) {
    let line = "";
    for (let bx = 0; bx < 3; bx++) {
      const sub = getSubDots(dots, bx, by);
      line += dotsToBraille(sub);
    }
    if (by === 0) upper = line;
    else lower = line;
  }
  return [upper, lower];
}

function getSubDots(dots, bx, by) {
  const sub = [];
  for (let y = 0; y < 3; y++) {
    for (let x = 0; x < 3; x++) {
      const px = bx * 3 + x;
      const py = by * 3 + y;
      const pos = y * 3 + x;
      const skip = [2, 5, 3, 4, 8];
      if (!skip.includes(pos))
        sub.push(dots[py * 9 + px]);
    }
  }
  return sub;
}

function dotsToBraille(bits) {
  const code = 0x2800 + bits.reduce((a, b, i) => a + (b ? 1 << i : 0), 0);
  return String.fromCharCode(code);
}
